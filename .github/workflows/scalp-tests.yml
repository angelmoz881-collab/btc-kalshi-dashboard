name: Scalp engine checks

on:
  push:
    paths:
      - "scalp_engine.py"
      - "test_scalp_engine.py"
      - "dashboard.py"
      - "candle_possible.py"
      - "kalshi_btc_discovery.py"
      - "test_kalshi_btc_discovery.py"
      - "buyer_seller_levels.py"
      - "test_buyer_seller_levels.py"
      - "candle_calibration.py"
      - "test_candle_calibration.py"
      - "test_candle_possible.py"
      - "auto_scalp.py"
      - "kalshi_account.py"
      - "test_auto_scalp.py"
      - ".github/workflows/scalp-tests.yml"
  pull_request:
    paths:
      - "scalp_engine.py"
      - "test_scalp_engine.py"
      - "dashboard.py"
      - "candle_possible.py"
      - "kalshi_btc_discovery.py"
      - "test_kalshi_btc_discovery.py"
      - "buyer_seller_levels.py"
      - "test_buyer_seller_levels.py"
      - "candle_calibration.py"
      - "test_candle_calibration.py"
      - "test_candle_possible.py"
      - "auto_scalp.py"
      - "kalshi_account.py"
      - "test_auto_scalp.py"
      - ".github/workflows/scalp-tests.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile dashboard.py scalp_engine.py auto_scalp.py kalshi_account.py candle_possible.py candle_calibration.py buyer_seller_levels.py kalshi_btc_discovery.py
      - name: Test scalp exit model
        run: |
          python -m pip install -q requests cryptography pandas numpy
          python -m unittest -v test_scalp_engine.py test_auto_scalp.py test_candle_possible.py test_candle_calibration.py test_buyer_seller_levels.py test_kalshi_btc_discovery.py
