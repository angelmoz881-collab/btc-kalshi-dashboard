name: Live scalp safety tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, live-scalp-20pct]

jobs:
  test-live-scalp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install requests cryptography
      - name: Run live scalp safety tests
        run: python -m unittest discover -s tests -p 'test_kalshi_live_trading.py' -v
